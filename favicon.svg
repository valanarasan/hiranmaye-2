<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3D36B" />
      <stop offset="50%" stop-color="#C89D46" />
      <stop offset="100%" stop-color="#A87A28" />
    </linearGradient>
  </defs>
  <!-- Deep Obsidian Navy Background -->
  <rect width="200" height="200" rx="44" fill="#0C182B" />
  
  <!-- Symmetrical Golden Lotus Emblem -->
  <g transform="translate(0, 26)" stroke="url(#gold)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Vertical Petal -->
    <path d="M 100, 10 C 82, 45 82, 95 100, 125 C 118, 95 118, 45 100, 10 Z" />

    <!-- Inner Left Petal -->
    <path d="M 100, 125 C 80, 115 52, 70 70, 22 C 86, 48 94, 90 100, 125 Z" />

    <!-- Inner Right Petal -->
    <path d="M 100, 125 C 120, 115 148, 70 130, 22 C 114, 48 106, 90 100, 125 Z" />

    <!-- Outer Left Petal -->
    <path d="M 100, 125 C 75, 124 25, 100 20, 52 C 45, 52 75, 80 100, 125 Z" />

    <!-- Outer Right Petal -->
    <path d="M 100, 125 C 125, 124 175, 100 180, 52 C 155, 52 125, 80 100, 125 Z" />

    <!-- Base Cradle Curve -->
    <path d="M 32, 66 C 45, 118 75, 134 100, 134 C 125, 134 155, 118 168, 66" stroke-width="4.5" />
  </g>
</svg>
